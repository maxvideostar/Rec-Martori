name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Build
        run: |
          mkdir dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/Rec-Martori.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/rec-martori-linux-amd64 .
          cp start.bat install-autostart.bat dist/
      - uses: actions/upload-artifact@v4
        with: { name: Rec-Martori, path: dist/ }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: 'dist/*' }
