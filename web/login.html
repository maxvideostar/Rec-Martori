<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rec-Martori — Autentificare</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;--acc:#e5484d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;width:min(360px,92vw)}
h1{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
p{margin:0 0 22px;color:var(--mut);font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0d1117;color:var(--txt);font-size:15px}
input:focus{outline:none;border-color:#58a6ff}
button{margin-top:22px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.err{color:#ff7b72;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1><span class="dot"></span>Rec-Martori</h1>
  <p>Înregistrare martori TV</p>
  <label>Utilizator</label><input name="user" autocomplete="username" autofocus>
  <label>Parolă</label><input name="pass" type="password" autocomplete="current-password">
  <button>Intră</button>
  <div class="err" id="e">Utilizator sau parolă greșită.</div>
</form>
<script>if(location.search.includes('err'))document.getElementById('e').style.display='block'</script>
</body>
</html>
